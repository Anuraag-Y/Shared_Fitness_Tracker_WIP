<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  input, button, textarea { font-family: inherit; color: var(--color-text); }
  input, textarea { background: transparent; border: 1px solid var(--color-neutral-800); border-radius: var(--radius-sm); padding: 9px 10px; font-size: 14px; }
  input::placeholder, textarea::placeholder { color: var(--color-neutral-700); }
  input:hover, textarea:hover { border-color: var(--color-neutral-700); }
  input:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  button { cursor: pointer; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .kicker { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-500); }
  .h1 { font-family: var(--font-heading); font-weight: 500; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
  .ghost { padding: 6px 12px; font-size: 13px; color: var(--color-neutral-400); background: transparent; border: none; border-radius: var(--radius-sm); }
  .ghost:hover { color: var(--color-text); }
  .ghost[data-on="1"] { color: var(--color-accent-200); background: var(--color-accent-900); }
  .outline { padding: 10px 18px; font-size: 14px; font-weight: 500; color: var(--color-accent); background: transparent; border: 1px solid var(--color-accent); border-radius: var(--radius-md); }
  .outline:hover { background: var(--color-accent-900); }
  .outline:active { border-color: var(--color-accent-400); }
  .chip { padding: 6px 12px; font-size: 13px; color: var(--color-neutral-300); background: transparent; border: 1px solid var(--color-neutral-800); border-radius: 999px; }
  .chip:hover { border-color: var(--color-accent); }
  .chip[data-on="1"] { color: var(--color-accent-200); background: var(--color-accent-800); border-color: var(--color-accent); }
  .row { display: grid; grid-template-columns: 26px minmax(0,1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 12px 10px; text-align: left; background: transparent; border: none; border-top: 1px solid var(--color-neutral-900); }
  .row:hover { background: #1c1f31; }
  .card { padding: 16px; background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  ::selection { background: var(--color-accent-800); }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
